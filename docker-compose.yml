

services:
  mongodb:
    image: mongo:6.0
    container_name: asha-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: asha_db
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: asha-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=asha-smart-production-key-2026
      - MONGODB_URI=mongodb://mongodb:27017/asha_db
    depends_on:
      - mongodb
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: asha-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-uploads:
  backend-data: